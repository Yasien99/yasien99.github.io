---
layout: default
title: Honors & Awards
navbar_title: Awards
---

<div class="row pt-4">
    <div class="col-12 col-lg-10 offset-lg-1">
        <h2 class="mb-4"><i class="fas fa-award"></i> Honors & Awards</h2>
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <ul class="list-unstyled mb-0">
                    {% for item in site.data.profile.awards %}
                    <li class="media mb-3 {% unless forloop.last %}border-bottom pb-3{% endunless %}">
                        <div class="media-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mt-0 mb-1 font-weight-bold">{{ item.name }}</h6>
                            </div>
                            <div class="text-muted no-break ml-3">
                                <em>{{ item.date }}</em>
                            </div>
                        </div>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
