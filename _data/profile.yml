short_bio: >-
  <p>I am a Ph.D. student in Information Technology at the Queensland University of Technology (QUT) in Brisbane, Australia. I am supervised by Prof. Raja Jurdak and Dr. Sara Khalifa.</p>
  <br/><p>Currently, my doctoral thesis focuses on "Rethinking Energy Harvesters as Sensors: A New Paradigm for Continuous Motion Tracking." I am exploring how to leverage wearable solar harvesters to achieve continuous and energy-efficient tracking capabilities.</p>
  <br/><p>I previously graduated with a BSc in Biomedical Engineering from Cairo University, where I gained a strong foundation in Machine Learning, Computer Vision, Digital Signal Processing, and Embedded Systems.</p>

